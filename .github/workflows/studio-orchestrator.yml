name: SG-CODEX Studio Orchestrator Validation

on:
  push:
    branches:
      - sg-codex-x1000-studio
    paths:
      - "studio/**"
      - ".github/workflows/studio-orchestrator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sg-codex-studio-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate orchestration plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run planner tests
        run: node --test studio/orchestrator.test.mjs
      - name: Generate plan (no workers launched)
        run: node studio/orchestrator.mjs > studio-plan.json
      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: sg-codex-studio-plan
          path: studio-plan.json
