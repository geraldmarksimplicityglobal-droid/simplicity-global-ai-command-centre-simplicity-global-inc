name: SG-ZAPIER-MCP-001 tests

on:
  push:
    branches:
      - codex/archive-zapier-mcp-001-clean
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/SG-ZAPIER-MCP-001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
