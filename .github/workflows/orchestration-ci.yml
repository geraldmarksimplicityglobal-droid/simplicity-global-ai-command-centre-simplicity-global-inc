name: SG-CODEX Orchestration CI

on:
  push:
    branches:
      - sg-codex-x1000-studio
    paths:
      - "orchestration/**"
      - ".github/workflows/orchestration-ci.yml"
  pull_request:
    paths:
      - "orchestration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-orchestrator:
    name: Verify scheduler and policy tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestration
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: npm run check
      - name: Unit tests
        run: npm test
