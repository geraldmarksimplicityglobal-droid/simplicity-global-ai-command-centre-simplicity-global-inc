name: SG Studio CI

on:
  push:
    branches: [sg-codex-x1000-studio]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q sg_studio tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Produce scheduler plan
        run: python -m sg_studio.orchestrator --workers 10 --json > studio-plan.json
      - name: Upload plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: sg-studio-plan-python-${{ matrix.python-version }}
          path: studio-plan.json
