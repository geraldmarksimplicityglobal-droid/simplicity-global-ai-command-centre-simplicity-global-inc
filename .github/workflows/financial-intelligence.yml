name: SG Financial Intelligence

on:
  push:
    paths:
      - "live-framework/FINANCIAL-INTELLIGENCE/**"
      - ".github/workflows/financial-intelligence.yml"
  pull_request:
    paths:
      - "live-framework/FINANCIAL-INTELLIGENCE/**"
      - ".github/workflows/financial-intelligence.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run financial intelligence tests
        working-directory: live-framework/FINANCIAL-INTELLIGENCE
        run: npm test
