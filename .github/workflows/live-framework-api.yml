name: Live Framework API checks

# Includes SG-AIF persistent runtime and tenant-scoped financial routing contracts.

on:
  pull_request:
    paths:
      - "live-framework/IMPLEMENTATION/api/**"
      - "live-framework/IMPLEMENTATION/web/**"
      - "live-framework/IMPLEMENTATION/identity/**"
      - "live-framework/index.html"
      - "live-framework/aif-runtime.html"
      - "live-framework/IMPLEMENTATION/schema.postgresql.sql"
      - "live-framework/IMPLEMENTATION/security-and-rls.sql"
      - "live-framework/IMPLEMENTATION/runtime-grants.template.sql"
      - "live-framework/IMPLEMENTATION/database-contract.sql"
      - "live-framework/IMPLEMENTATION/sg-aif-persistence.sql"
      - "live-framework/IMPLEMENTATION/sg-aif-persistence-contract.sql"
      - "live-framework/IMPLEMENTATION/sg-aif-execution-jobs.sql"
      - ".github/workflows/live-framework-api.yml"
  push:
    branches:
      - "codex/live-enterprise-framework"
    paths:
      - "live-framework/IMPLEMENTATION/api/**"
      - "live-framework/IMPLEMENTATION/web/**"
      - "live-framework/IMPLEMENTATION/identity/**"
      - "live-framework/index.html"
      - "live-framework/aif-runtime.html"
      - "live-framework/IMPLEMENTATION/schema.postgresql.sql"
      - "live-framework/IMPLEMENTATION/security-and-rls.sql"
      - "live-framework/IMPLEMENTATION/runtime-grants.template.sql"
      - "live-framework/IMPLEMENTATION/database-contract.sql"
      - "live-framework/IMPLEMENTATION/sg-aif-persistence.sql"
      - "live-framework/IMPLEMENTATION/sg-aif-persistence-contract.sql"
      - ".github/workflows/live-framework-api.yml"

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sg_framework_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sg_framework_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sg_framework_test
    defaults:
      run:
        working-directory: live-framework/IMPLEMENTATION/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: node --check src/server.js
      - run: node --check src/scope.js
      - run: node --check src/aif-runtime.mjs
      - run: node --check src/aif-routes.js
      - run: node --check ../web/api-client.js
      - run: node --check ../web/github-enterprise-login.js
      - run: node --check ../web/auth-config.js
      - run: npm test
      - name: Apply migrations to ephemeral PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../schema.postgresql.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../security-and-rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../sg-aif-persistence.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../sg-aif-execution-jobs.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../runtime-grants.template.sql
      - name: Verify tenant isolation and append-only audit controls
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../database-contract.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../sg-aif-persistence-contract.sql
