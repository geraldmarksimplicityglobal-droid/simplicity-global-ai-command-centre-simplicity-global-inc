name: Android Engineering CI

on:
  push:
    paths:
      - 'live-framework/ANDROID-ENGINEERING/**'
      - '.github/workflows/android-engineering-ci.yml'
  pull_request:
    paths:
      - 'live-framework/ANDROID-ENGINEERING/**'
      - '.github/workflows/android-engineering-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run release-policy and skill tests
        working-directory: live-framework/ANDROID-ENGINEERING
        run: node --test tools/test/*.test.mjs
      - name: Run Kotlin unit tests and assemble debug APK
        working-directory: live-framework/ANDROID-ENGINEERING
        run: gradle :app:testDebugUnitTest :app:assembleDebug
