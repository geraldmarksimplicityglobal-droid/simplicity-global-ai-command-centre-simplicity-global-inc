name: Domain Registrar Package Checks

on:
  push:
    branches: [codex/live-enterprise-framework]
    paths:
      - "live-framework/DOMAIN-REGISTRAR/**"
      - ".github/workflows/domain-registrar.yml"
  pull_request:
    paths:
      - "live-framework/DOMAIN-REGISTRAR/**"
      - ".github/workflows/domain-registrar.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: live-framework/DOMAIN-REGISTRAR
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax checks
        run: npm run check
      - name: Offline unit tests
        run: npm test
