<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email</title></head><body><main><h1>Verify your email</h1><button id="verify">Confirm email address</button><p id="status" role="status"></p></main><script type="module">const token=new URLSearchParams(location.search).get('token');document.querySelector('#verify').addEventListener('click',async()=>{const r=await fetch('/api/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const d=await r.json();document.querySelector('#status').textContent=d.message||d.error;});</script></body></html>
