<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password</title></head><body><main><h1>Reset your password</h1><form id="forgot"><label>Email <input name="email" type="email" required></label><button>Send reset link</button></form><p id="status" role="status"></p></main><script type="module">document.querySelector('#forgot').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});const d=await r.json();document.querySelector('#status').textContent=d.message||d.error;});</script></body></html>
