<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title></head><body><main><h1>Choose a new password</h1><form id="reset"><label>New password <input name="password" type="password" minlength="12" maxlength="128" required></label><button>Reset password</button></form><p id="status" role="status"></p></main><script type="module">document.querySelector('#reset').addEventListener('submit',async e=>{e.preventDefault();const token=new URLSearchParams(location.search).get('token');const password=new FormData(e.currentTarget).get('password');const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const d=await r.json();document.querySelector('#status').textContent=d.message||d.error;});</script></body></html>
